apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: test-runbook-protocol-relative
  namespace: openshift-monitoring
spec:
  groups:
  - name: test-runbook-sanitization
    interval: 30s
    rules:
    - alert: TestAlertProtocolRelative
      expr: vector(1)
      for: 0m
      labels:
        severity: warning
        test: runbook-sanitization
        runbook_url: "//evil.example.com/malicious"
      annotations:
        runbook_url: "//evil.example.com/malicious"
        summary: "//evil.example.com/malicious"
        description: "//evil.example.com/malicious"